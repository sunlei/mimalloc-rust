[workspace]
resolver = "3"
members = ["mimalloc-rust-sys", "xtask"]
# Keep bindgen (xtask) out of everyday `cargo build` / `cargo test`.
default-members = ["mimalloc-rust-sys"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
repository = "https://github.com/sunlei/mimalloc-rust"

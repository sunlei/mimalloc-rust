name: CI

on:
  push:
  pull_request:

# A newer push to the same branch or pull request supersedes the running workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-latest }
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, container: "rust:1.99-alpine" }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, container: "rust:1.99-alpine" }
    steps:
      - name: Install build tools (Alpine)
        if: matrix.container
        run: apk add --no-cache bash git clang-dev binutils
      - name: Install libclang (Ubuntu)
        if: runner.os == 'Linux' && !matrix.container
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - uses: actions/checkout@v4
        if: ${{ !matrix.container }}
        with:
          submodules: recursive
      # GitHub cannot run JavaScript actions such as checkout in Alpine containers on Arm64.
      - name: Check out (containers)
        if: matrix.container
        run: |
          git config --global --add safe.directory '*'
          git init -q
          git fetch -q --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
          git submodule update -q --init --recursive --depth 1
      - name: Install Rust
        if: ${{ !matrix.container }}
        run: rustup toolchain install stable --profile minimal && rustup default stable
      # For the same reason, only the native runners cache dependencies.
      - uses: Swatinem/rust-cache@v2.9.2
        if: ${{ !matrix.container }}
      - run: cargo test --locked
      - run: cargo test --locked --release
      - name: Test features
        shell: bash
        run: |
          for features in secure debug no_thp local_dynamic_tls secure,debug override override,secure override,local_dynamic_tls override,debug; do
            cargo test --locked --features "mimalloc-rust/${features//,/,mimalloc-rust/}"
          done
      # The override probe only discriminates in release; see tests/override_probe.rs.
      - run: cargo test --locked --release --features mimalloc-rust/override
      # Static musl executables cannot load the shared library this test builds.
      - name: Override across a C shared library
        if: ${{ !matrix.container }}
        run: cargo test --locked --release -p downstream-c
      # A crt-static musl binary cannot dlopen libclang, so build the xtask dynamically there.
      - name: Bindings match this target
        env:
          RUSTFLAGS: ${{ matrix.container && '-C target-feature=-crt-static' || '' }}
        run: cargo run --locked -p xtask -- bindgen --check
      - name: Bound functions are linkable
        env:
          RUSTFLAGS: ${{ matrix.container && '-C target-feature=-crt-static' || '' }}
        run: cargo run --locked -p xtask -- check-symbols

  # Rust's Linux aarch64 targets are ARMv8.0; prove the C code runs without LSE atomics.
  armv8-0:
    name: ${{ matrix.target }} on Cortex-A72 (no LSE)
    runs-on: ubuntu-24.04-arm
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-unknown-linux-gnu, container: "rust:1.99-trixie", install: "apt-get update && apt-get install -y qemu-user" }
          - { target: aarch64-unknown-linux-musl, container: "rust:1.99-alpine", install: "apk add --no-cache git qemu-aarch64" }
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -cpu cortex-a72
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUNNER: qemu-aarch64 -cpu cortex-a72
    steps:
      - run: ${{ matrix.install }}
      # As in the test job: no JavaScript actions in Alpine containers on Arm64.
      - name: Check out
        run: |
          git config --global --add safe.directory '*'
          git init -q
          git fetch -q --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
          git submodule update -q --init --recursive --depth 1
      # Only the release run: the dev build differs in optimization level alone, which does
      # not decide whether LSE instructions appear (`-moutline-atomics` does).
      - run: cargo test --locked --release --target ${{ matrix.target }}

  # Unpinned nightly by choice: new lints and formatting changes surface without manual bumps.
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # --allow-downgrade falls back to the newest nightly that ships both components.
      - run: rustup toolchain install nightly --profile minimal --component rustfmt,clippy --allow-downgrade
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo +nightly fmt --all --check
      - run: cargo +nightly clippy --locked --workspace --all-targets --all-features -- -D warnings
      # Catches rustdoc warnings such as broken intra-doc links in the published crates.
      - run: cargo +nightly doc --locked --no-deps -p mimalloc-rust -p mimalloc-rust-sys
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: rustup toolchain install 1.99.0 --profile minimal
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo +1.99.0 test --locked

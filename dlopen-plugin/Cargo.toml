[package]
name = "dlopen-plugin"
description = "Tests local_dynamic_tls with a plugin that a process loads through dlopen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# `xtask test-dlopen` builds the cdylib explicitly and passes its path to the test.
[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
mimalloc-rust = { path = "../mimalloc-rust", features = ["local_dynamic_tls"] }

[build-dependencies]
cc.workspace = true

# Loads the plugin into a process of its own, whose static TLS the test fills first.
[[test]]
name = "dlopen"
harness = false

[lints]
workspace = true

[package]
name = "upstream-tests"
description = "Runs upstream mimalloc's C tests against the library mimalloc-rust-sys builds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
mimalloc-rust-sys = { path = "../mimalloc-rust-sys" }

[build-dependencies]
cc.workspace = true

# Each upstream test is a C program: run it as its own process with its exit status.
[[test]]
name = "api"
harness = false

[[test]]
name = "api_fill"
harness = false

[[test]]
name = "arena"
harness = false

[[test]]
name = "bitmap"
harness = false

[[test]]
name = "fork"
harness = false

[[test]]
name = "pprof"
harness = false

[[test]]
name = "profile"
harness = false

[[test]]
name = "qsbr"
harness = false

[[test]]
name = "stress"
harness = false

[[test]]
name = "stress_heaps"
harness = false

[[test]]
name = "stress_pprof"
harness = false

[[test]]
name = "stress_subprocs"
harness = false

[lints]
workspace = true

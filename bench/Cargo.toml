[package]
name = "bench"
description = "Benchmarks for mimalloc-rust, kept out of the library's dev-dependencies"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
mimalloc-rust = { path = "../mimalloc-rust" }
mimalloc-rust-sys = { path = "../mimalloc-rust-sys" }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "alloc"
harness = false

[[bench]]
name = "global"
harness = false

[lints]
workspace = true

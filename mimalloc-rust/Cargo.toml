[package]
name = "mimalloc-rust"
description = "A global allocator backed by a vendored, statically linked mimalloc v3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

# The library has no unit tests. With `override` on musl, rustc links `libc.a` before the
# mimalloc archive in this one test binary, which fails with duplicate `malloc` definitions.
[lib]
test = false

[features]
secure = ["mimalloc-rust-sys/secure"]
debug = ["mimalloc-rust-sys/debug"]
no_thp = ["mimalloc-rust-sys/no_thp"]
local_dynamic_tls = ["mimalloc-rust-sys/local_dynamic_tls"]
override = ["mimalloc-rust-sys/override"]

[dependencies]
mimalloc-rust-sys = { path = "../mimalloc-rust-sys" }

[dev-dependencies]
serde_json = "1"

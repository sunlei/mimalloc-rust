[package]
name = "mimalloc-rust"
description = "A global allocator backed by a vendored, statically linked mimalloc v3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[features]
secure = ["mimalloc-rust-sys/secure"]
debug = ["mimalloc-rust-sys/debug"]
no_thp = ["mimalloc-rust-sys/no_thp"]
local_dynamic_tls = ["mimalloc-rust-sys/local_dynamic_tls"]
override = ["mimalloc-rust-sys/override"]

[dependencies]
mimalloc-rust-sys = { path = "../mimalloc-rust-sys" }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
serde_json.workspace = true

[[bench]]
name = "alloc"
harness = false

[lints]
workspace = true
